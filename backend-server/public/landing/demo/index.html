<style>
/* ═══════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO — el mismo :root que backend-server/public/landing/index.html.
   Copiado literal a propósito (no un <link> compartido): esta página vive en su
   propia carpeta servida como estático, y el resto de la landing no expone su
   CSS como archivo aparte tampoco — mismo patrón, no una inconsistencia nueva.
═══════════════════════════════════════════════════════════════ */
:root {
  --bg:        #f7f7f5;
  --surface:   #ffffff;
  --elevated:  #fafaf9;
  --hover:     #f0f0ee;

  --border:    rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.13);
  --border-lg: rgba(0,0,0,0.18);

  --amber:       #d97706;
  --amber-dk:    #b45309;
  --amber-lt:    #f59e0b;
  --amber-muted: rgba(217,119,6,0.10);
  --amber-glow:  rgba(217,119,6,0.20);

  --text-1: #1a1a1a;
  --text-2: #4a4a4a;
  --text-3: #8a8a8a;
  --text-4: #c0c0c0;

  --green:     #059669;
  --green-bg:  rgba(5,150,105,0.09);
  --blue:      #2563eb;
  --blue-bg:   rgba(37,99,235,0.09);
  --red:       #dc2626;
  --red-bg:    rgba(220,38,38,0.09);
  --purple:    #7c3aed;
  --purple-bg: rgba(124,58,237,0.09);

  --font:       'Inter', system-ui, sans-serif;
  --font-serif: 'Crimson Pro', Georgia, serif;
  --font-mono:  'Cascadia Code', 'Consolas', monospace;

  --r-sm: 6px; --r: 10px; --r-lg: 16px; --r-xl: 24px;

  --sh-sm: 0 1px 4px rgba(0,0,0,0.07);
  --sh:    0 4px 16px rgba(0,0,0,0.08);
  --sh-lg: 0 8px 32px rgba(0,0,0,0.10);
  --sh-xl: 0 20px 60px rgba(0,0,0,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
}

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 13.5px/1 var(--font); border: none; border-radius: var(--r-sm);
  padding: 11px 22px; cursor: pointer; text-decoration: none;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--amber); color: #fff; box-shadow: 0 4px 14px var(--amber-glow); }
.btn-primary:hover { background: var(--amber-dk); transform: translateY(-2px); box-shadow: 0 6px 20px var(--amber-glow); }
.btn-ghost { background: var(--surface); color: var(--text-1); border: 1px solid var(--border-md); box-shadow: var(--sh-sm); }
.btn-ghost:hover { background: var(--hover); transform: translateY(-1px); }
.btn:disabled { opacity:.35; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

.label {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--amber);
}
.label::before { content:''; width:16px; height:2px; background:var(--amber); border-radius:1px; flex-shrink:0; }

.h2 {
  font-family: var(--font-serif);
  font-size: clamp(1.9rem, 3.6vw, 2.7rem);
  font-weight: 300; line-height: 1.15; letter-spacing: -.015em;
  color: var(--text-1);
}
em { font-style: italic; color: var(--amber); }
.lead { font-size: 15.5px; line-height: 1.75; color: var(--text-2); max-width: 640px; margin-top: 12px; }

.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.tag-amber { background: var(--amber-muted); color: var(--amber-dk); border: 1px solid rgba(217,119,6,.18); }

/* ─── NAVBAR ──────────────────────────────────────────────────── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  height: 58px;
  display: flex; align-items: center; gap: 18px;
  padding: 0 1.6rem;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink:0; }
.nav-brand-icon { width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 2px 8px var(--amber-glow); object-fit: cover; display: block; }
.nav-brand-text { display: flex; flex-direction: column; line-height: 1; }
.nav-brand-name { font-size: 13.5px; font-weight: 700; color: var(--text-1); letter-spacing: -.02em; }
.nav-brand-name b { color: var(--amber); }
.nav-brand-sub { font-size: 9.5px; font-weight: 600; letter-spacing: .04em; color: var(--text-3); margin-top: 2px; }
.nav-back {
  font-size: 12px; font-weight: 500; color: var(--text-3); text-decoration: none;
  display:flex; align-items:center; gap:5px; flex-shrink:0; padding-left: 14px; border-left: 1px solid var(--border);
}
.nav-back:hover { color: var(--text-1); }
.nav-back svg { flex-shrink:0; }

.chapter-nav {
  flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  -ms-overflow-style: none;
}
.chapter-nav::-webkit-scrollbar { display: none; }
.chapter-tab {
  flex-shrink: 0; display:flex; align-items:center; gap:6px;
  height: 32px; padding: 0 12px; border-radius: var(--r-sm);
  font: 500 12px/1 var(--font); color: var(--text-3);
  background: transparent; border: none; cursor: pointer; white-space: nowrap;
  transition: .15s;
}
.chapter-tab:hover { background: var(--hover); color: var(--text-1); }
.chapter-tab.active { background: var(--amber-muted); color: var(--amber-dk); font-weight: 600; }
.chapter-tab-n { font-family: var(--font-mono); font-size: 10px; opacity: .6; }

.nav-cta {
  flex-shrink: 0;
  height: 32px; padding: 0 16px;
  background: var(--amber); color: #fff;
  border: none; border-radius: var(--r-sm);
  font: 600 12.5px/1 var(--font); cursor: pointer; text-decoration: none;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 2px 10px var(--amber-glow);
  transition: .15s;
}
.nav-cta:hover { background: var(--amber-dk); transform: translateY(-1px); }

/* ─── LAYOUT ──────────────────────────────────────────────────── */
main { padding: 96px 1.6rem 60px; max-width: 1040px; margin: 0 auto; }

.chapter { display: none; }
.chapter.active { display: block; animation: fadein .35s; }
@keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.chapter-head { text-align:center; max-width: 680px; margin: 0 auto 40px; }
.chapter-head .label { justify-content:center; margin-bottom: 10px; }
.chapter-head .label::before { display:none; }
.chapter-head .lead { margin: 12px auto 0; }

.pills { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top: 20px; }
.pill {
  font-size: 11.5px; font-weight: 500; color: var(--text-2);
  background: var(--elevated); border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 20px;
}

/* ─── STEPPER ─────────────────────────────────────────────────── */
.stepper { max-width: 880px; margin: 0 auto; }

.step-counter {
  text-align:center; font-size: 12px; font-weight:600; color: var(--text-3);
  margin-bottom: 14px; font-family: var(--font-mono);
}
.step-counter b { color: var(--amber-dk); }

.step-frame {
  border-radius: var(--r-xl); overflow: hidden;
  border: 1px solid var(--border-md);
  box-shadow: var(--sh-xl);
  background: var(--surface);
}
.step-titlebar {
  background: var(--elevated); border-bottom: 1px solid var(--border);
  padding: 10px 14px; display: flex; align-items: center; gap: 7px;
}
.dot { width:11px; height:11px; border-radius:50%; }
.dot-r{background:#ff5f57} .dot-y{background:#febc2e} .dot-g{background:#28c840}
.step-titlebar-label { font-size: 11px; color: var(--text-3); margin-left: 8px; font-family: var(--font-mono); }

.step-media { background: #eceae6; display:flex; align-items:center; justify-content:center; aspect-ratio: 1280 / 800; }
.step-media img { width: 100%; height: 100%; object-fit: contain; display:block; }

.step-placeholder {
  width: 100%; height: 100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 10px; padding: 2rem; text-align:center; color: var(--text-3);
}
.step-placeholder-icon { font-size: 30px; opacity: .55; }
.step-placeholder-title { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.step-placeholder-sub { font-size: 12px; max-width: 360px; line-height: 1.6; }

.step-caption {
  padding: 18px 22px; font-size: 13.5px; color: var(--text-2); line-height: 1.6;
  border-top: 1px solid var(--border);
}
.step-caption b { color: var(--text-1); }

.step-controls { display:flex; align-items:center; gap: 14px; justify-content:center; margin-top: 22px; }
.step-nav-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border-md); box-shadow: var(--sh-sm);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color: var(--text-2);
  transition: .15s;
}
.step-nav-btn:hover:not(:disabled) { background: var(--hover); transform: translateY(-1px); }
.step-dots { display:flex; gap: 7px; }
.step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-lg); border:none; cursor:pointer; padding:0; transition:.15s; }
.step-dot.active { background: var(--amber); width: 20px; border-radius: 4px; }

/* ─── CHAPTER FOOTER (CTA) ────────────────────────────────────── */
.chapter-cta { text-align:center; margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border); }
.chapter-cta-lead { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }

.chapter-pager { display:flex; justify-content:space-between; align-items:center; margin-top: 20px; gap: 12px; }
.chapter-pager-btn {
  display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; color: var(--text-3);
  text-decoration:none; padding: 8px 4px; cursor:pointer; background:none; border:none;
}
.chapter-pager-btn:hover:not(:disabled) { color: var(--amber-dk); }
.chapter-pager-btn:disabled { opacity: 0; pointer-events:none; }
.chapter-pager-btn.next { margin-left:auto; }

/* ─── MOCKS (6.6-6.8, sin dependencia de ningún sistema) ─────────── */
.mock-editor {
  width:100%; height:100%; background:#1e1e1e; color:#d4d4d4;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.85;
  display:flex; flex-direction:column;
}
.mock-editor-tabs { display:flex; background:#252526; border-bottom:1px solid #333; flex-shrink:0; }
.mock-editor-tab { padding:8px 16px; font-size:11.5px; color:#969696; border-right:1px solid #333; }
.mock-editor-tab.active { background:#1e1e1e; color:#fff; }
.mock-editor-body { flex:1; overflow:auto; padding: 14px 0; display:flex; }
.mock-editor-gutter { padding: 0 12px; text-align:right; color:#5a5a5a; user-select:none; white-space:pre; }
.mock-editor-code { padding-right: 20px; white-space:pre-wrap; }
.mock-editor-code .mh  { color:#4ec9b0; font-weight:600; } /* headings */
.mock-editor-code .mmask { background:rgba(220,38,38,.18); color:#f28b82; padding:0 3px; border-radius:3px; }
.mock-editor-code .mdim { color:#6a6a6a; }

.mock-chat { width:100%; height:100%; background:#fafafa; display:flex; flex-direction:column; }
.mock-chat-head { padding: 12px 16px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:600; color:var(--text-2); }
.mock-chat-head-dot { width:8px; height:8px; border-radius:50%; background:var(--purple); }
.mock-chat-body { flex:1; overflow:auto; padding: 18px; display:flex; flex-direction:column; gap: 14px; }
.mock-bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 12.5px; line-height:1.6; }
.mock-bubble.user { align-self:flex-end; background: var(--amber); color:#fff; border-bottom-right-radius:4px; }
.mock-bubble.ai { align-self:flex-start; background:#fff; border:1px solid var(--border); color: var(--text-1); border-bottom-left-radius:4px; }
.mock-bubble.ai b { color: var(--amber-dk); }

/* ─── RESPONSIVE ──────────────────────────────────────────────── */
@media(max-width:960px) {
  main { padding-top: 108px; }
  .nav { flex-wrap: wrap; height:auto; padding: 10px 1.2rem; }
  .nav-back { display:none; }
  .chapter-nav { order: 3; flex: 1 1 100%; padding-top: 6px; border-top:1px solid var(--border); margin-top:6px; }
}
@media(max-width:600px) {
  .step-controls { gap: 8px; }
  .pills { gap:6px; }
  .step-caption { padding: 14px 16px; font-size:13px; }
}
</style>
</head>

// ─── Estado ───────────────────────────────────────────────────────
let currentChapter = 0;
let currentStep = 0;

function chapterIndexFromHash() {
  const slug = location.hash.replace('#', '');
  const idx = CHAPTERS.findIndex(c => c.slug === slug);
  return idx >= 0 ? idx : 0;
}

// ─── Gate de sesión (D6) ─────────────────────────────────────────
// El resto de la demo (más allá de "El problema" y "Procuración") es una
// guía para clientes ya registrados, no un gancho de venta — así que el
// gate es de UX, no de seguridad: mismo token que usa el portal
// (usuarios/app.js, TOKEN_KEY='psc_user_token'). Si no hay token, o está
// vencido, lo peor que pasa es que alguien vea 2 capítulos más de
// screenshots ya públicos — no hay nada sensible detrás del gate.
//
// ⚠️ /demo/ vive en `procuradortool.com`; el portal vive en
// `api.procuradortool.com` — son ORÍGENES DISTINTOS, así que el localStorage
// del portal no es legible acá directo (bug real reportado por el operador:
// "Ver demo" desde el portal logueado seguía mostrando el gate bloqueado,
// igual que un visitante anónimo desde la landing). Fix: el portal pasa el
// token por el hash de la URL (`#sso=<token>`, mismo patrón ya usado para
// que Electron entre logueado al portal — ver `usuarios/app.js`,
// `wireVerDemoLinks()`) y esta página lo consume una sola vez al cargar,
// guardándolo en SU PROPIO localStorage bajo la misma key.
const TOKEN_KEY = 'psc_user_token';
const CAPITULOS_LIBRES = ['problema', 'procuracion'];
const PORTAL_URL = 'https://api.procuradortool.com/usuarios/';

function consumirTokenDesdeHash() {
  if (!location.hash.startsWith('#sso=')) return;
  const token = decodeURIComponent(location.hash.slice(5));
  try { if (token) localStorage.setItem(TOKEN_KEY, token); } catch (_) {}
  // Limpia el hash para no dejar el token crudo en la barra de direcciones
  // ni confundir al router de capítulos (chapterIndexFromHash).
  history.replaceState(null, '', location.pathname + location.search);
}
consumirTokenDesdeHash();

// S11 (2026-09-01, revision-S11-2026-09-01.md): antes, haySesion() solo miraba si el
// token EXISTÍA — nunca si seguía vigente. El JWT del portal dura 8h (routes/auth.js,
// /auth/portal-login) y este origen NO lo borra nunca por sí solo (no hay logout acá,
// y el logout del portal tampoco lo alcanza — son orígenes distintos, ver el comentario
// de arriba). Sin este chequeo, un token robado o simplemente vencido seguía
// "desbloqueando" la demo indefinidamente.
//
// Esto NO verifica la firma (no hay clave pública en el cliente ni hace falta — el
// backend sigue siendo quien valida cualquier request real). Solo lee el claim `exp`
// para decidir si conviene seguir mostrando la sesión como activa en ESTE origen, y
// si venció, la borra — mismo criterio que cualquier cliente que decodifica su propio
// JWT para UI (no para autorización).
function base64UrlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return atob(str);
}

function tokenVencido(token) {
  try {
    const partes = token.split('.');
    if (partes.length !== 3) return true; // no tiene forma de JWT → tratar como inválido
    const payload = JSON.parse(base64UrlDecode(partes[1]));
    // F7 cadena AG (2026-09-01, hallazgo H-A1-04, confirmado real): un JWT con
    // forma válida pero sin claim `exp` (o `exp` no numérico) devolvía `false`
    // ("no vencido") — un token sintético armado a mano, sin firmar por el
    // backend real, desbloqueaba la demo para siempre. `/auth/portal-login`
    // SIEMPRE firma con `expiresIn`, así que todo JWT legítimo trae `exp`
    // numérico — la ausencia del claim es en sí misma la señal de un token
    // no genuino. Fail-closed: sin `exp` → tratarlo como vencido, igual que
    // el caso ya corrupto de abajo.
    if (!payload || typeof payload.exp !== 'number') return true;
    return (Date.now() / 1000) >= payload.exp;
  } catch (_) {
    return true; // corrupto/no decodificable → fail-closed, tratarlo como vencido
  }
}

function haySesion() {
  try {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return false;
    if (tokenVencido(token)) {
      localStorage.removeItem(TOKEN_KEY);
      return false;
    }
    return true;
  } catch (_) { return false; }
}

function capituloBloqueado(chapter) {
  return !haySesion() && !CAPITULOS_LIBRES.includes(chapter.slug);
}

// ─── Render ─────────────────────────────────────────────────────
function renderChapterNav() {
  const el = document.getElementById('chapterNav');
  el.innerHTML = CHAPTERS.map((c, i) => `
    <button class="chapter-tab" data-idx="${i}">
      ${c.n ? `<span class="chapter-tab-n">${c.n}</span>` : ''} ${c.label}${capituloBloqueado(c) ? ' 🔒' : ''}
    </button>
  `).join('');
  el.querySelectorAll('.chapter-tab').forEach(btn => {
    btn.addEventListener('click', () => goToChapter(Number(btn.dataset.idx)));
  });
}

function renderStep() {
  const chapter = CHAPTERS[currentChapter];
  const step = chapter.steps[currentStep];
  const media = document.getElementById('stepMedia');
  const label = document.getElementById('stepTitlebarLabel');
  const caption = document.getElementById('stepCaption');
  const counter = document.getElementById('stepCounter');

  label.textContent = `Paso ${step.n}`;
  counter.innerHTML = `Paso <b>${currentStep + 1}</b> de ${chapter.steps.length}`;
  caption.innerHTML = step.caption;

  if (step.img) {
    media.innerHTML = `<img src="assets/${step.img}" alt="Paso ${step.n}" loading="lazy">`;
  } else if (step.mock === 'editor') {
    media.innerHTML = mockEditorHTML();
  } else if (step.mock === 'chat1' || step.mock === 'chat2') {
    media.innerHTML = mockChatHTML(step.mock);
  } else if (step.placeholder) {
    media.innerHTML = `
      <div class="step-placeholder">
        <div class="step-placeholder-icon">📸</div>
        <div class="step-placeholder-title">Captura pendiente</div>
        <div class="step-placeholder-sub">${step.reason}</div>
      </div>`;
  }

  document.getElementById('prevStepBtn').disabled = currentStep === 0;
  document.getElementById('nextStepBtn').disabled = currentStep === chapter.steps.length - 1;

  const dots = document.getElementById('stepDots');
  dots.innerHTML = chapter.steps.map((s, i) =>
    `<button class="step-dot ${i === currentStep ? 'active' : ''}" data-i="${i}" title="Paso ${s.n}"></button>`
  ).join('');
  dots.querySelectorAll('.step-dot').forEach(d => {
    d.addEventListener('click', () => { currentStep = Number(d.dataset.i); renderStep(); });
  });
}

function renderChapter() {
  const chapter = CHAPTERS[currentChapter];
  currentStep = 0;

  document.querySelectorAll('.chapter-tab').forEach((btn, i) => {
    btn.classList.toggle('active', i === currentChapter);
  });

  const main = document.getElementById('main');

  if (capituloBloqueado(chapter)) {
    main.innerHTML = `
      <div class="chapter active">
        <div class="chapter-head">
          <div class="label">${chapter.n ? 'Capítulo ' + chapter.n + ' · ' : ''}${chapter.label}</div>
          <h2 class="h2">${chapter.title}</h2>
        </div>
        <div class="stepper">
          <div class="step-frame">
            <div class="step-titlebar">
              <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
              <span class="step-titlebar-label">Capítulo bloqueado</span>
            </div>
            <div class="step-media">
              <div class="step-placeholder">
                <div class="step-placeholder-icon">🔒</div>
                <div class="step-placeholder-title">Iniciá sesión para ver el resto de la demo</div>
                <div class="step-placeholder-sub">
                  "El problema" y "Procuración" son de acceso libre. El resto es una guía pensada
                  para clientes ya registrados — entrá con tu cuenta para seguir.
                </div>
                <a href="${PORTAL_URL}" class="btn btn-primary" style="margin-top:6px">Iniciar sesión</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    return;
  }

  main.innerHTML = `
    <div class="chapter active">
      <div class="chapter-head">
        <div class="label">${chapter.n ? 'Capítulo ' + chapter.n + ' · ' : ''}${chapter.label}</div>
        <h2 class="h2">${chapter.title}</h2>
        <p class="lead" style="margin-left:auto;margin-right:auto">${chapter.lead}</p>
        ${chapter.pills.length ? `<div class="pills">${chapter.pills.map(p => `<span class="pill">${p}</span>`).join('')}</div>` : ''}
      </div>

      <div class="stepper">
        <div class="step-counter" id="stepCounter"></div>
        <div class="step-frame">
          <div class="step-titlebar">
            <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
            <span class="step-titlebar-label" id="stepTitlebarLabel"></span>
          </div>
          <div class="step-media" id="stepMedia"></div>
          <div class="step-caption" id="stepCaption"></div>
        </div>
        <div class="step-controls">
          <button class="step-nav-btn" id="prevStepBtn" title="Paso anterior (←)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
          </button>
          <div class="step-dots" id="stepDots"></div>
          <button class="step-nav-btn" id="nextStepBtn" title="Paso siguiente (→)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>
          </button>
        </div>
      </div>

      <div class="chapter-cta">
        <div class="chapter-cta-lead">¿Te sirve ${chapter.label.toLowerCase() === 'el problema' ? 'Procurador SCW' : chapter.label}?</div>
        <a href="${REGISTER_URL}" class="btn btn-primary">
          Empezar ahora
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </a>
        <div class="chapter-pager">
          <button class="chapter-pager-btn prev" id="prevChapterBtn">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
            ${currentChapter > 0 ? CHAPTERS[currentChapter - 1].label : ''}
          </button>
          <button class="chapter-pager-btn next" id="nextChapterBtn">
            ${currentChapter < CHAPTERS.length - 1 ? CHAPTERS[currentChapter + 1].label : ''}
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>
          </button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('prevStepBtn').addEventListener('click', () => stepBy(-1));
  document.getElementById('nextStepBtn').addEventListener('click', () => stepBy(1));
  if (currentChapter > 0) document.getElementById('prevChapterBtn').addEventListener('click', () => goToChapter(currentChapter - 1));
  else document.getElementById('prevChapterBtn').disabled = true;
  if (currentChapter < CHAPTERS.length - 1) document.getElementById('nextChapterBtn').addEventListener('click', () => goToChapter(currentChapter + 1));
  else document.getElementById('nextChapterBtn').disabled = true;

  renderStep();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function stepBy(delta) {
  const chapter = CHAPTERS[currentChapter];
  const next = currentStep + delta;
  if (next < 0 || next >= chapter.steps.length) return;
  currentStep = next;
  renderStep();
}

function goToChapter(idx) {
  currentChapter = idx;
  location.hash = CHAPTERS[idx].slug;
  renderChapter();
}

// ─── Teclado: ← → mueven de paso; en el borde, pasan de capítulo ──
document.addEventListener('keydown', (e) => {
  const chapter = CHAPTERS[currentChapter];
  // Capítulo bloqueado: no hay stepper en el DOM (stepBy() rompería contra
  // elementos que no existen) — solo se puede saltar de capítulo entero.
  if (capituloBloqueado(chapter)) {
    if (e.key === 'ArrowRight' && currentChapter < CHAPTERS.length - 1) goToChapter(currentChapter + 1);
    else if (e.key === 'ArrowLeft' && currentChapter > 0) goToChapter(currentChapter - 1);
    return;
  }
  if (e.key === 'ArrowRight') {
    if (currentStep < chapter.steps.length - 1) stepBy(1);
    else if (currentChapter < CHAPTERS.length - 1) goToChapter(currentChapter + 1);
  } else if (e.key === 'ArrowLeft') {
    if (currentStep > 0) stepBy(-1);
    else if (currentChapter > 0) goToChapter(currentChapter - 1);
  }
});

window.addEventListener('hashchange', () => {
  currentChapter = chapterIndexFromHash();
  renderChapter();
});

renderChapterNav();
currentChapter = chapterIndexFromHash();
renderChapter();
</script>
