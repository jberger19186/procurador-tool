<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Informes — Procurador SCW</title>
<style>
  :root {
    --bg-base:       #f7f7f5;
    --bg-surface:    #ffffff;
    --bg-elevated:   #fafaf9;
    --bg-hover:      #f0f0ee;
    --border:        rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.13);
    --accent:        #d97706;
    --accent-dark:   #b45309;
    --accent-muted:  rgba(217,119,6,0.10);
    --accent-glow:   rgba(217,119,6,0.18);
    --text-1: #1a1a1a;
    --text-2: #5c5c5c;
    --text-3: #a8a8a8;
    --success:    #059669;
    --success-bg: rgba(5,150,105,0.09);
    --error:      #dc2626;
    --error-bg:   rgba(220,38,38,0.09);
    --warning:    #d97706;
    --warning-bg: rgba(217,119,6,0.09);
    --font:      "Inter","Segoe UI",system-ui,sans-serif;
    --font-mono: "Cascadia Code","Consolas",monospace;
    --radius-sm: 6px;
    --radius:    10px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg-base);
    color: var(--text-1);
    font-size: 13px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .ob-header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .logo-mark {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--accent), #f59e0b);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  .header-title { font-size: 14px; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em; }
  .header-meta  { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .header-spacer { flex: 1; }
  .btn {
    height: 30px; padding: 0 13px;
    border-radius: var(--radius-sm); border: none;
    font-size: 12px; font-family: var(--font); font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.13s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 6px var(--accent-glow); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border-strong); }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-1); }

  /* ── Stats ── */
  .stats-row {
    display: grid; grid-template-columns: repeat(4,1fr);
    gap: 10px; padding: 14px 22px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
  }
  .stat-card {
    background: var(--bg-base); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; transition: 0.13s;
  }
  .stat-card:hover { border-color: var(--border-strong); }
  .stat-icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .stat-val   { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text-3); margin-top: 3px; font-weight: 500; }

  /* ── Toolbar ── */
  .table-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 22px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-base); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 0 11px; height: 30px; width: 280px;
    transition: 0.13s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); background: #fff; }
  .search-box svg { color: var(--text-3); flex-shrink: 0; }
  .search-box input { background: transparent; border: none; color: var(--text-1); font-family: var(--font); font-size: 12.5px; flex: 1; outline: none; }
  .search-box input::placeholder { color: var(--text-3); }

  .filter-chip {
    height: 28px; padding: 0 11px; border-radius: 20px;
    border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-2);
    font-size: 11.5px; font-family: var(--font);
    cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.12s;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent-dark); }
  .filter-chip.active { background: var(--accent-muted); border-color: var(--accent); color: var(--accent-dark); font-weight: 600; }
  .filter-dot { width: 6px; height: 6px; border-radius: 50%; }
  .toolbar-spacer { flex: 1; }
  .result-count { font-size: 11.5px; color: var(--text-3); }

  /* ── Table ── */
  .table-wrapper { padding: 0 22px 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  thead th {
    text-align: left; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-3); padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; background: var(--bg-base);
  }
  thead th.center { text-align: center; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr.hidden { display: none; }
  td { padding: 9px 12px; font-size: 12.5px; color: var(--text-2); }
  td.center { text-align: center; }
  td.mono { font-family: var(--font-mono); font-size: 12px; color: var(--accent-dark); font-weight: 600; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .badge-ok  { background: var(--success-bg); color: var(--success); }
  .badge-err { background: var(--error-bg);   color: var(--error); }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .btn-pdf {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 11px;
    border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    font-size: 11px; font-family: var(--font); font-weight: 500;
    cursor: pointer; background: transparent; color: var(--text-2);
    text-decoration: none; transition: all 0.12s;
  }
  .btn-pdf:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-pdf.disabled { opacity: 0.35; pointer-events: none; cursor: not-allowed; }

  .no-results { text-align: center; padding: 48px; color: var(--text-3); display: none; }
  .no-results.show { display: block; }

  /* ── Footer ── */
  .ob-footer {
    padding: 14px 22px; border-top: 1px solid var(--border);
    background: var(--bg-surface); text-align: center;
    font-size: 12px; color: var(--text-3); margin-top: 8px;
  }
  .ob-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .ob-footer a:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .table-toolbar { flex-wrap: wrap; }
    .search-box { width: 100%; }
  }

  /* ── Bitácora (F2.1) ── */
  th.bit-sel-cell, td.bit-sel-cell { width: 30px; text-align: center; }
  .bit-checkbox { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
  .bit-bar {
    display: none; align-items: center; gap: 8px;
    padding: 9px 22px; background: var(--accent-muted);
    border-bottom: 1px solid var(--border);
  }
  .bit-bar.active { display: flex; }
  .bit-bar-count { font-size: 12px; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
  .bit-btn {
    height: 27px; padding: 0 11px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: var(--bg-surface);
    color: var(--text-2); font-size: 11.5px; font-family: var(--font); font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: 0.12s;
  }
  .bit-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .bit-btn-ghost { background: transparent; border: none; color: var(--text-3); font-size: 11px; cursor: pointer; }
  .bit-btn-ghost:hover { color: var(--error); }
  .bit-row-cell { width: 40px; text-align: center; position: relative; }
  .bit-plus-btn {
    height: 24px; width: 24px; border-radius: 6px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--accent-dark); font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: 0.12s;
  }
  .bit-plus-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .bit-ficha-link {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10.5px; color: var(--accent-dark); text-decoration: none; font-weight: 600;
    padding: 3px 7px; border-radius: 6px; background: var(--accent-muted);
  }
  /* Punto 9: número de expediente como link cuando el caso ya está seguido. */
  a.exp-link { color: var(--accent-dark); text-decoration: none; }
  a.exp-link:hover { text-decoration: underline; }
  .bit-menu {
    display: none; position: absolute; right: 0; top: 28px; z-index: 50;
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); box-shadow: 0 8px 28px rgba(0,0,0,0.11);
    min-width: 170px; padding: 5px; text-align: left;
  }
  .bit-menu.open { display: block; }
  .bit-menu-item {
    display: block; width: 100%; padding: 7px 10px; border: none; background: none;
    text-align: left; font-size: 12px; font-family: var(--font); color: var(--text-1);
    cursor: pointer; border-radius: 5px; white-space: nowrap;
  }
  .bit-menu-item:hover { background: var(--bg-hover); }
  .bit-menu-sep { height: 1px; background: var(--border); margin: 5px 2px; }
</style>
</head>
<body>

<!-- Header -->
<div class="ob-header">
  <div class="logo-mark">⚖️</div>
  <div>
    <div class="header-title">Visor de Informes</div>
    <div class="header-meta">Generado el: <span id="fechaEjecucion">--/--/---- --:--</span></div>
  </div>
  <div class="header-spacer"></div>
  <button class="btn btn-primary" id="btnRegenerar">🔄 Regenerar fallidos</button>
</div>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-icon" style="background:var(--accent-muted)">📋</div>
    <div><div class="stat-val" style="color:var(--accent-dark)" id="statTotal">0</div><div class="stat-label">Total procesados</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:var(--success-bg)">✅</div>
    <div><div class="stat-val" style="color:var(--success)" id="statExitosos">0</div><div class="stat-label">Exitosos</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:var(--error-bg)">⚠️</div>
    <div><div class="stat-val" style="color:var(--error)" id="statFallidos">0</div><div class="stat-label">Fallidos</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:var(--success-bg)">📈</div>
    <div><div class="stat-val" style="color:var(--success)" id="statPorcentaje">0%</div><div class="stat-label">Tasa de éxito</div></div>
  </div>
</div>

<!-- Bitácora: barra de acciones sobre la selección -->
<div id="bit-bar" class="bit-bar"></div>

<!-- Toolbar -->
<div class="table-toolbar">
  <div class="search-box">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3 3"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar expediente...">
  </div>
  <button class="filter-chip active" data-filter="todos"><div class="filter-dot" style="background:var(--accent)"></div>Todos</button>
  <button class="filter-chip" data-filter="exitosos"><div class="filter-dot" style="background:var(--success)"></div>Exitosos</button>
  <button class="filter-chip" data-filter="fallidos"><div class="filter-dot" style="background:var(--error)"></div>Fallidos</button>
  <div class="toolbar-spacer"></div>
  <span class="result-count" id="result-count"></span>
</div>

<!-- Table -->
<div class="table-wrapper">
  <table>
    <thead>
      <tr id="bit-thead-row">
        <th style="width:5%">N°</th>
        <th>Expediente</th>
        <th>Carátula</th>
        <th class="center" style="width:14%">Estado</th>
        <th class="center" style="width:10%">Código</th>
        <th class="center" style="width:10%">PDF</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="no-results" id="noResults">No se encontraron resultados</div>
</div>

<!-- Footer -->
<div class="ob-footer">
  Procurador SCW &nbsp;·&nbsp; <a href="#" id="linkExcel">📊 Descargar Excel</a>
  <span id="bit-footer-link"></span>
</div>

<script>
  // DATOS INYECTADOS (reemplazados por generador_visor.js)
  const DATOS_BATCH = {
    fechaEjecucion: '2025-12-02 03:00:00',
    expedientes: [],
    rutaExcel: '',
    bitacora: { enabled: false, seguidos: [] }
  };

  document.addEventListener('DOMContentLoaded', () => {
    inicializar();
    setupEventos();
  });

  function inicializar() {
    document.getElementById('fechaEjecucion').textContent = DATOS_BATCH.fechaEjecucion;
    const total    = DATOS_BATCH.expedientes.length;
    const exitosos = DATOS_BATCH.expedientes.filter(e => e.ok).length;
    const fallidos = total - exitosos;
    const porcentaje = total > 0 ? ((exitosos / total) * 100).toFixed(1) : 0;
    document.getElementById('statTotal').textContent     = total;
    document.getElementById('statExitosos').textContent  = exitosos;
    document.getElementById('statFallidos').textContent  = fallidos;
    document.getElementById('statPorcentaje').textContent = porcentaje + '%';

    const btnRegenerar = document.getElementById('btnRegenerar');
    if (fallidos === 0) {
      btnRegenerar.disabled    = true;
      btnRegenerar.textContent = '✅ Sin errores';
    }
    if (DATOS_BATCH.rutaExcel) document.getElementById('linkExcel').href = DATOS_BATCH.rutaExcel;
    if (typeof bitInit === 'function') bitInit();
    renderizarTabla(DATOS_BATCH.expedientes);
  }

  function renderizarTabla(expedientes) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    expedientes.forEach((exp, index) => {
      const tr = document.createElement('tr');
      // F3 (2026-08-31, code-review): único de los usos de exp.expediente en este
      // archivo sin guard '|| ""' — un solo expediente con `expediente` ausente/null
      // en el lote tiraba acá, abortando inicializar() ANTES de que corriera
      // setupEventos() (mismo handler DOMContentLoaded) y dejando todo el visor sin
      // buscador/filtros/botón de regenerar, no solo esa fila.
      tr.dataset.expediente = (exp.expediente || '').toLowerCase();
      tr.dataset.estado = exp.ok ? 'ok' : 'error';
      const pdfBtn = exp.ok
        ? `<a href="${exp.rutaPDF || '#'}" class="btn-pdf">📄 Abrir PDF</a>`
        : `<span class="btn-pdf disabled">N/A</span>`;
      const bitCell = (typeof bitRowCell === 'function') ? bitRowCell(exp, index) : '';
      const expCell = (typeof bitExpCellHtml === 'function') ? bitExpCellHtml(exp) : esc(exp.expediente);
      // Punto 19: columna de carátula — el dato ya llega en `exp.caratula` desde B4
      // (antes ni siquiera se generaba; ahora el generador la propaga en vez de tirarla).
      const caratula = exp.caratula || '';
      const caratulaCorta = caratula.length > 55 ? caratula.substring(0, 55) + '…' : caratula;
      tr.innerHTML = `
        ${bitCell}
        <td style="color:var(--text-3)">${index + 1}</td>
        <td class="mono">${expCell}</td>
        <td title="${escAttr(caratula)}" style="color:var(--text-1)">${esc(caratulaCorta) || '—'}</td>
        <td class="center">
          <span class="status-badge ${exp.ok ? 'badge-ok' : 'badge-err'}">
            <span class="badge-dot"></span>${exp.ok ? 'OK' : 'Error'}
          </span>
        </td>
        <td class="center" style="color:var(--text-3)">${exp.exitCode || 0}</td>
        <td class="center">${pdfBtn}</td>`;
      tbody.appendChild(tr);
    });
    if (typeof bitAfterRenderTabla === 'function') bitAfterRenderTabla();
    actualizarContador();
  }

  function setupEventos() {
    document.getElementById('searchInput').addEventListener('input', e => filtrarTabla(e.target.value));
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        filtrarPorEstado(e.currentTarget.dataset.filter);
      });
    });
    document.getElementById('btnRegenerar').addEventListener('click', generarTxtFallidos);
  }

  function filtrarTabla(texto) {
    const busqueda = texto.toLowerCase();
    document.querySelectorAll('#tableBody tr').forEach(fila => {
      fila.classList.toggle('hidden', !fila.dataset.expediente.includes(busqueda));
    });
    actualizarContador();
  }

  function filtrarPorEstado(filtro) {
    document.querySelectorAll('#tableBody tr').forEach(fila => {
      const visible = filtro === 'todos' ||
        (filtro === 'exitosos' && fila.dataset.estado === 'ok') ||
        (filtro === 'fallidos' && fila.dataset.estado === 'error');
      fila.classList.toggle('hidden', !visible);
    });
    actualizarContador();
  }

  function actualizarContador() {
    const visibles = document.querySelectorAll('#tableBody tr:not(.hidden)').length;
    document.getElementById('noResults').classList.toggle('show', visibles === 0);
    const rc = document.getElementById('result-count');
    if (rc) rc.textContent = visibles + ' resultado' + (visibles !== 1 ? 's' : '');
  }

  function generarTxtFallidos() {
    const fallidos = DATOS_BATCH.expedientes.filter(e => !e.ok).map(e => e.expediente).join('\n');
    if (!fallidos) { alert('No hay expedientes fallidos para regenerar'); return; }
    const blob = new Blob([fallidos], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `expedientes_fallidos_${Date.now()}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('✅ Archivo generado. Usalo en el menú Opción 2 para reprocesar.');
  }

  // ═══════════════════════════════════════════════════════════════════════
  // BITÁCORA (F2.1) — botonera de captura desde el visor de informe por lote.
  // A diferencia del visor de procuración, `main.js` controla `DATOS_BATCH`
  // directamente (ver H1 del plan) — `DATOS_BATCH.bitacora` ya viene poblado
  // sin necesidad de post-procesado ni marcador de reemplazo.
  //
  // El modelo de datos es más chico que el de procuración, pero menos de lo que
  // decía esta nota. Se corrigió dos veces por el mismo motivo: el script SÍ sabía
  // el dato y se perdía en el camino, no era que "el informe no lo trae".
  //   · carátula  → B4 (puntos 19/20): venía en el payload RESULT y este visor la tiraba.
  //   · movimientos → el script los persiste en listaMovimientos.json para armar el PDF;
  //     acá iban fijos en '[]' y dejaban todo snapshot de informe vacío.
  // Lo que genuinamente NO trae este flujo es jurisdicción/dependencia/situación:
  // esas quedan vacías y el usuario las completa desde Mis Expedientes si quiere.
  //
  // 2026-09-04 — secciones completas del informe (históricos/intervinientes/
  // vinculados/recursos/notas), además de los movimientos actuales de arriba.
  // Cada `exp.<sección>` ya viene LIMPIA desde `movimientosInforme.js` (Node, del
  // lado de Electron) — acá solo se serializa, no se procesa nada.
  //
  // 🚨 Umbral de tamaño (decisión del operador, ver la propuesta de secciones
  // completas): las 5 secciones extra viajan en el POST SOLO cuando la acción es
  // 'snapshot-lote' (la única que las persiste — 'ficha-lote'/'entrada-lote' las
  // ignorarían igual del lado del servidor) Y la selección es de hasta
  // `UMBRAL_SECCIONES_LOTE` casos. `captureDrafts.js` rechaza ENTERO cualquier
  // borrador de más de 256 KB; medido con datos reales, agregar las 5 secciones
  // multiplica por ~2,1 el peso de cada caso — sin este umbral, un lote grande
  // que hoy entra pasaría a rechazarse completo. Con la selección chica (el caso
  // de uso real: "quiero el detalle completo de ESTE expediente") no hay ningún
  // riesgo de tamaño.
  // ═══════════════════════════════════════════════════════════════════════
  var seleccionados = new Set();
  var seguidosSet = new Set();
  var UMBRAL_SECCIONES_LOTE = 50;

  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // F3 (2026-08-31, code-review): esc() no escapa comillas — una carátula legítima
  // con comillas (ej. RUIZ c/ "LA CAJA" S.A.) rompía el atributo title="..." de abajo.
  // Mismo helper que ya existe en visorModal_template.html (E4-1, julio 2026) y en
  // generarVisorMonitoreo.js — portado acá, que nunca lo tuvo.
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function claveLigera(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function yaSeguido(exp) { return seguidosSet.has(claveLigera(exp.expediente)); }
  // Punto 9: mismo mecanismo que el visor de procuración — el link lleva el número
  // real, el portal (B1) lo resuelve al id de la ficha con la normalización del backend.
  function fichaUrl(exp) { return 'https://api.procuradortool.com/usuarios/?goto=expediente&exp=' + encodeURIComponent(exp.expediente || ''); }

  // Punto 5: optimista — este visor tampoco recibe confirmación del POST a
  // /usuarios/capture (otra pestaña, otro origen). Ver el comentario gemelo en
  // visorModal_template.html para el razonamiento completo.
  function marcarComoGuardado(exp) {
    var clave = claveLigera(exp.expediente);
    if (seguidosSet.has(clave)) return;
    seguidosSet.add(clave);
    renderizarTabla(DATOS_BATCH.expedientes);
  }
  function marcarLoteComoGuardado(lista) {
    var cambio = false;
    lista.forEach(function (exp) {
      var clave = claveLigera(exp.expediente);
      if (!seguidosSet.has(clave)) { seguidosSet.add(clave); cambio = true; }
    });
    if (cambio) renderizarTabla(DATOS_BATCH.expedientes);
  }

  function bitInit() {
    if (!DATOS_BATCH.bitacora || !DATOS_BATCH.bitacora.enabled) return;
    seguidosSet = new Set((DATOS_BATCH.bitacora.seguidos || []).map(claveLigera));

    // Punto 8: dos columnas — ícono de estado individual + checkbox de selección
    // múltiple, independiente entre sí (ver el comentario largo en
    // visorModal_template.html; misma decisión, mismo motivo).
    const theadRow = document.getElementById('bit-thead-row');
    if (theadRow) {
      const th1 = document.createElement('th'); th1.className = 'bit-sel-cell';
      const th2 = document.createElement('th'); th2.className = 'bit-sel-cell';
      theadRow.insertBefore(th2, theadRow.firstChild);
      theadRow.insertBefore(th1, theadRow.firstChild);
    }
    window.bitRowCell = function (exp, index) {
      const estadoCell = yaSeguido(exp)
        ? '<td class="bit-sel-cell"><a class="bit-ficha-link" href="' + fichaUrl(exp) + '" target="procurador_portal" title="Ya seguido — ver ficha">📁</a></td>'
        : '<td class="bit-sel-cell"><button type="button" class="bit-plus-btn" data-bit-guardar-idx="' + index + '" title="Guardar caso en tu Bitácora">💾</button></td>';
      const checkCell = '<td class="bit-sel-cell"><input type="checkbox" class="bit-checkbox" data-bit-idx="' + index + '"' + (seleccionados.has(index) ? ' checked' : '') + '></td>';
      return estadoCell + checkCell;
    };
    window.bitExpCellHtml = function (exp) {
      const num = esc(exp.expediente || '');
      return yaSeguido(exp)
        ? '<a class="exp-link" href="' + fichaUrl(exp) + '" target="procurador_portal" title="Ver ficha en Bitácora">' + num + '</a>'
        : num;
    };
    window.bitAfterRenderTabla = function () {
      document.querySelectorAll('.bit-checkbox').forEach(function (chk) {
        chk.addEventListener('change', function () {
          const idx = parseInt(chk.dataset.bitIdx, 10);
          if (chk.checked) seleccionados.add(idx); else seleccionados.delete(idx);
          renderBarra();
        });
      });
      document.querySelectorAll('[data-bit-guardar-idx]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const exp = DATOS_BATCH.expedientes[parseInt(btn.dataset.bitGuardarIdx, 10)];
          enviarCaptura(Object.assign({ accion: 'ficha' }, campoDeCaso(exp)));
          marcarComoGuardado(exp);
        });
      });
      renderBarra();
    };

    const pie = document.getElementById('bit-footer-link');
    if (pie) {
      pie.innerHTML = ' &nbsp;·&nbsp; 📔 <a href="https://api.procuradortool.com/usuarios/?goto=bitacora" target="procurador_portal">Bitácora</a> — tus vencimientos y casos seguidos, en el portal';
    }
  }

  function enviarCaptura(campos) {
    const form = document.createElement('form');
    form.method = 'POST';
    // F2.6: si hay sesión activa en la app al momento de generar el visor, se manda
    // el token en el FRAGMENTO de la URL (nunca en query ni en el body — un fragmento
    // no se transmite en el request HTTP, así que el endpoint anónimo de captura jamás
    // lo ve). El navegador reaplica el fragmento de la request original al 303 del
    // servidor (verificado con un servidor de prueba antes de implementar esto — mismo
    // "POST binding" que usan SSO/SAML). Mismo mecanismo que `openPortalSection()` en
    // la app — acá el token viaja embebido porque el visor es un archivo estático, no
    // hay IPC al que pedírselo en el momento del click.
    // B.3 (A), fase E11: lo que viaja ya NO es el JWT de login (8 h, acceso completo)
    // sino la LLAVE DE CAPTURA: 30 minutos, `scope: 'capture'`, un solo uso, y el
    // backend la rechaza en todos los endpoints salvo el reclamo de ESTE borrador.
    // Va en DOS lugares y hacen falta los dos:
    //   · `#sso=` — para el portal (el fragmento nunca llega al servidor).
    //   · campo oculto `capture_token` — para el servidor, que sin él no puede
    //     saber de quién es la captura (B.5: el borrador nace con dueño).
    const captureToken = (DATOS_BATCH.bitacora && DATOS_BATCH.bitacora.captureToken) || null;
    form.action = 'https://api.procuradortool.com/usuarios/capture' + (captureToken ? ('#sso=' + encodeURIComponent(captureToken)) : '');
    form.target = 'procurador_portal';
    form.style.display = 'none';
    const todos = Object.assign({ goto: 'bitacora-nueva', origen: 'informe' }, campos);
    if (captureToken) todos.capture_token = captureToken;
    Object.keys(todos).forEach(function (k) {
      if (todos[k] === undefined || todos[k] === null) return;
      const input = document.createElement('input');
      input.name = k;
      input.value = String(todos[k]);
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    setTimeout(function () { form.remove(); }, 500);
  }

  // Nombre del PDF a partir de la ruta relativa que ya arma el generador
  // (`./<archivo con encodeURIComponent>`). Es lo único propio del informe que la
  // procuración no tiene, y da contexto en el modal del portal: el snapshot deja
  // dicho QUÉ archivo salió de esa corrida. Se manda el nombre, no la ruta: el PDF
  // vive en el disco del usuario y un origen http no puede abrir un file://.
  function nombrePdfDe(exp) {
    if (!exp.rutaPDF) return '';
    try { return decodeURIComponent(String(exp.rutaPDF).replace(/^\.\//, '')); }
    catch (_) { return String(exp.rutaPDF).replace(/^\.\//, ''); }
  }

  // `incluirSecciones` — ver el comentario grande de arriba (Umbral de tamaño).
  // Default `true`: el único llamador que NO lo pasa explícito es el botón
  // individual de fila ("💾 Guardar caso", accion:'ficha', un solo caso) — ahí
  // el tamaño nunca es un problema, así que no hace falta que decida.
  function campoDeCaso(exp, incluirSecciones) {
    if (incluirSecciones === undefined) incluirSecciones = true;
    // Punto 20: `car` salía siempre vacío — el dato existía (el script lo scrapea para
    // el PDF) pero se perdía en el camino antes de B4. Ver generador_visor.js/prepararDatos.
    // `movs` tenía el mismo defecto y era peor: iba fijo en '[]', así que TODO snapshot
    // de informe quedaba vacío y el portal mostraba "Sin movimientos registrados" sobre
    // un informe que sí los tenía (2 de 2 en producción). Ver movimientosInforme.js.
    const campo = {
      exp: exp.expediente || '', jur: '', dep: '', car: exp.caratula || '', sit: '',
      fproc: DATOS_BATCH.fechaEjecucion || '',
      movs: JSON.stringify(exp.movimientos || []),
      pdf: nombrePdfDe(exp)
    };
    if (!incluirSecciones) return campo;
    // Las 5 secciones extra (2026-09-04): mismo patrón que `movs`, un campo por
    // sección, cada uno un JSON serializado — así `capture.js` puede seguir
    // tratando cada uno como texto de formulario, sin cambiar el transporte.
    campo.hist = JSON.stringify(exp.historicos || []);
    campo.interv = JSON.stringify(exp.intervinientes || []);
    campo.vinc = JSON.stringify(exp.vinculados || []);
    campo.rec = JSON.stringify(exp.recursos || []);
    campo.notas = JSON.stringify(exp.notas || []);
    return campo;
  }
  function accionLote(accion, tipo) {
    if (seleccionados.size === 0) return;
    const exps = Array.from(seleccionados).map(function (i) { return DATOS_BATCH.expedientes[i]; });
    // Solo 'snapshot-lote' persiste las secciones extra ('ficha-lote'/'entrada-lote'
    // las ignorarían del lado del servidor) — y solo si el lote entra en el umbral
    // de tamaño. NUNCA `exps.map(campoDeCaso)` a secas: `Array.prototype.map` pasa
    // el índice como 2º argumento, y `campoDeCaso` ahora lo interpretaría como
    // `incluirSecciones` (un índice > 0 es truthy).
    const incluirSecciones = accion === 'snapshot-lote' && exps.length <= UMBRAL_SECCIONES_LOTE;
    const lote = exps.map(function (exp) { return campoDeCaso(exp, incluirSecciones); });
    enviarCaptura({ accion: accion, tipo: tipo, lote: JSON.stringify(lote) });
    marcarLoteComoGuardado(exps);
  }

  function renderBarra() {
    const bar = document.getElementById('bit-bar');
    if (!bar) return;
    if (seleccionados.size === 0) { bar.classList.remove('active'); bar.innerHTML = ''; return; }
    bar.classList.add('active');
    bar.innerHTML =
      '<span class="bit-bar-count">☑ ' + seleccionados.size + ' seleccionado' + (seleccionados.size !== 1 ? 's' : '') + '</span>' +
      '<button class="bit-btn" id="bit-bar-casos">📌 Guardar casos</button>' +
      '<button class="bit-btn" id="bit-bar-inf">💾 Guardar informe de seleccionados</button>' +
      '<button class="bit-btn" id="bit-bar-entradas">＋ Crear entradas…</button>' +
      '<button class="bit-btn-ghost" id="bit-bar-limpiar" style="margin-left:auto">✕ limpiar</button>';
    document.getElementById('bit-bar-casos').onclick    = function () { accionLote('ficha-lote'); };
    document.getElementById('bit-bar-inf').onclick      = function () { accionLote('snapshot-lote'); };
    // Punto 14: el selector de tipo por botones ahora vive del lado autenticado del
    // portal (B2) — el prompt() nativo queda eliminado, no reemplazado acá.
    document.getElementById('bit-bar-entradas').onclick = function () { accionLote('entrada-lote', null); };
    document.getElementById('bit-bar-limpiar').onclick  = function () {
      seleccionados.clear();
      document.querySelectorAll('.bit-checkbox').forEach(function (c) { c.checked = false; });
      renderBarra();
    };
  }
</script>
</body>
</html>
